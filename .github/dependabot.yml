version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: website
    schedule:
      interval: monthly
    allow:
      - dependency-type: direct
      - dependency-name: caniuse-lite
    groups:
      npm:
        patterns:
          - '*'
